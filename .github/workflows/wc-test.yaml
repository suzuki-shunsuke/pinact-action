---
name: Test
on:
  workflow_call:
    inputs:
      sha:
        description: The commit SHA where the action was built
        required: true
        type: string
permissions: {}
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: write # The action pushes a commit if pinact fixes files
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{inputs.sha}}
          persist-credentials: false
      # The action built by the release job
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - uses: ./
      - uses: ./
        with:
          separator: "  # "
