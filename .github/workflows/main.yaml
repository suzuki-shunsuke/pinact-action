name: Update the latest branch
on:
  push:
    branches:
      - main
jobs:
  build:
    uses: suzuki-shunsuke/js-action-release-workflow/.github/workflows/release.yaml@926d8ac583b51179ff3f5532992cd545292bdab0 # v0.0.7
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      version: latest
