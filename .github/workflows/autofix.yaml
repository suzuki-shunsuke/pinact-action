---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  fix:
    uses: suzuki-shunsuke/js-autofix-action/.github/workflows/autofix-ci.yaml@14ba0e336fffecbc007e00fb059a03d665c27c9f # v0.0.7
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.65.2
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
  autofix:
    # Required status check of this workflow
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - fix
    steps:
      - run: exit 1
