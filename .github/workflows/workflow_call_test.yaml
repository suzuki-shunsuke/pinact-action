---
name: test (workflow_call)
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/js-action-release-workflow/.github/workflows/release.yaml@16e5ae83421dd948ccc5171777361ee8a389d550 # v0.0.3
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    with:
      version: pr/${{github.event.pull_request.number}}
      pr: ${{github.event.pull_request.number}}

  # Test the action built by the release job
  test:
    uses: ./.github/workflows/wc-test.yaml
    needs: release
    permissions:
      contents: write
    with:
      sha: ${{needs.release.outputs.sha}}

  test-js:
    uses: suzuki-shunsuke/js-action-test-workflow/.github/workflows/test.yaml@c834a7dfc9560fb54167eaf33f94eb28f1a4e222 # v0.0.4
    permissions:
      contents: read
      id-token: write
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read
